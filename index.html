<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1,
viewport-fit=cover
"
/>

<title>Astra Connect</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet"
/>

<style>

:root{

    --bg:#020617;

    --card:
    rgba(15,23,42,.72);

    --card2:
    rgba(30,41,59,.75);

    --blue:#2563eb;

    --blue2:#7c3aed;

    --green:#22c55e;

    --red:#dc2626;

    --text:#ffffff;

    --sub:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

html,body{

    width:100%;
    height:100%;

    overflow:hidden;

    background:
    linear-gradient(
        135deg,
        #020617,
        #0f172a
    );
}

body{
    color:white;
}



/* =========================
APP
========================= */

.app{

    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;
}



/* =========================
LOGIN
========================= */

.login{

    position:fixed;
    inset:0;

    background:
    linear-gradient(
        135deg,
        #020617,
        #0f172a
    );

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:999999;

    padding:20px;
}

.login-box{

    width:100%;
    max-width:420px;

    background:
    rgba(15,23,42,.78);

    backdrop-filter:
    blur(20px);

    border:
    1px solid rgba(255,255,255,.06);

    border-radius:34px;

    padding:30px;

    display:flex;
    flex-direction:column;

    gap:18px;

    box-shadow:
    0 20px 60px rgba(0,0,0,.4);
}

.login-logo{

    width:92px;
    height:92px;

    margin:auto;

    border-radius:28px;

    background:
    linear-gradient(
        135deg,
        var(--blue),
        var(--blue2)
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:38px;

    box-shadow:
    0 15px 40px rgba(37,99,235,.35);
}

.login-title{

    text-align:center;

    font-size:34px;

    font-weight:800;
}

.login-sub{

    text-align:center;

    color:var(--sub);

    line-height:1.6;

    font-size:14px;
}

.input{

    width:100%;

    border:none;
    outline:none;

    background:
    rgba(255,255,255,.05);

    color:white;

    padding:17px;

    border-radius:18px;

    font-size:15px;

    backdrop-filter:blur(10px);
}

.btn{

    border:none;

    background:
    linear-gradient(
        135deg,
        var(--blue),
        var(--blue2)
    );

    color:white;

    padding:17px;

    border-radius:18px;

    font-weight:700;

    font-size:15px;

    cursor:pointer;

    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}



/* =========================
TOPBAR
========================= */

.topbar{

    height:78px;

    background:
    rgba(15,23,42,.72);

    backdrop-filter:
    blur(18px);

    border-bottom:
    1px solid rgba(255,255,255,.06);

    display:flex;
    align-items:center;
    justify-content:space-between;

    padding:0 18px;

    gap:14px;

    flex-shrink:0;
}



/* LEFT */

.top-left{

    display:flex;
    align-items:center;

    gap:14px;
}

.app-logo{

    width:52px;
    height:52px;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #7c3aed
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:24px;

    box-shadow:
    0 10px 30px rgba(37,99,235,.35);
}

.app-info{

    display:flex;
    flex-direction:column;
}

.app-name{

    font-size:19px;

    font-weight:800;

    letter-spacing:.3px;
}

.app-version{

    font-size:11px;

    color:#60a5fa;

    margin-top:2px;
}



/* CENTER */

.top-center{

    flex:1;

    display:flex;
    justify-content:center;
}

.room-badge{

    background:
    rgba(255,255,255,.06);

    border:
    1px solid rgba(255,255,255,.08);

    padding:10px 16px;

    border-radius:999px;

    font-size:13px;

    color:#4ade80;

    backdrop-filter:blur(10px);
}



/* RIGHT */

.top-right{

    display:flex;
    align-items:center;

    gap:10px;
}

.group-select,
.user{

    border:none;
    outline:none;

    background:
    rgba(255,255,255,.06);

    color:white;

    padding:11px 14px;

    border-radius:14px;

    backdrop-filter:blur(10px);
}

.logout{

    width:46px;
    height:46px;

    border:none;

    border-radius:14px;

    background:
    linear-gradient(
        135deg,
        #dc2626,
        #b91c1c
    );

    color:white;

    cursor:pointer;

    font-size:18px;
}



/* =========================
MESSAGES
========================= */

.messages{

    flex:1;

    overflow-y:auto;

    padding:18px;

    display:flex;
    flex-direction:column;

    gap:14px;

    scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
    width:6px;
}

.messages::-webkit-scrollbar-thumb{

    background:#334155;

    border-radius:10px;
}

.row{
    display:flex;
}

.row.me{
    justify-content:flex-end;
}

.msg{

    max-width:80%;

    background:
    rgba(30,41,59,.72);

    backdrop-filter:
    blur(12px);

    padding:13px;

    border-radius:24px;

    border:
    1px solid rgba(255,255,255,.04);

    animation:fade .2s ease;
}

.row.me .msg{

    background:
    linear-gradient(
        135deg,
        var(--blue),
        var(--blue2)
    );
}

.name{

    font-size:13px;

    font-weight:700;

    margin-bottom:6px;

    color:#93c5fd;
}

.text{

    line-height:1.6;

    word-break:break-word;

    font-size:15px;
}

.time{

    margin-top:7px;

    font-size:11px;

    opacity:.7;
}

.chat-image{

    width:100%;

    max-width:260px;

    border-radius:18px;

    margin-top:8px;

    cursor:pointer;

    transition:.2s;
}

.chat-image:hover{
    transform:scale(1.02);
}



/* =========================
BOTTOM
========================= */

.bottom{

    background:
    rgba(15,23,42,.72);

    backdrop-filter:
    blur(18px);

    border-top:
    1px solid rgba(255,255,255,.06);

    padding:12px;

    padding-bottom:
    calc(
        env(safe-area-inset-bottom)
        + 12px
    );
}

.sendbox{

    display:flex;

    gap:10px;

    align-items:center;
}

.image-btn{

    width:56px;
    height:56px;

    background:
    rgba(255,255,255,.06);

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    font-size:20px;

    flex-shrink:0;
}

.send-input{

    flex:1;

    border:none;
    outline:none;

    background:
    rgba(255,255,255,.06);

    color:white;

    padding:16px;

    border-radius:18px;

    font-size:15px;
}

.send-btn{

    width:56px;
    height:56px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        var(--blue),
        var(--blue2)
    );

    color:white;

    cursor:pointer;

    font-size:18px;

    flex-shrink:0;
}



/* =========================
IMAGE VIEWER
========================= */

.image-viewer{

    position:fixed;
    inset:0;

    background:
    rgba(0,0,0,.94);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:999999;

    padding:20px;
}

.viewer-image{

    max-width:100%;
    max-height:100%;

    border-radius:20px;

    object-fit:contain;

    animation:zoom .2s ease;
}



/* =========================
ANIMATION
========================= */

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes zoom{

    from{
        opacity:0;
        transform:scale(.85);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}



/* =========================
MOBILE
========================= */

@media(max-width:700px){

    .topbar{

        height:auto;

        flex-wrap:wrap;

        padding:14px;
    }

    .top-center{

        order:3;

        width:100%;

        justify-content:flex-start;
    }

    .top-right{

        width:100%;

        overflow:auto;
    }

    .msg{
        max-width:92%;
    }

    .messages{
        padding:14px;
    }

    .send-input{
        font-size:16px;
    }

    .app-name{
        font-size:17px;
    }

}



/* =========================
PC
========================= */

@media(min-width:1000px){

    .app{

        max-width:1200px;

        margin:auto;

        border-left:
        1px solid rgba(255,255,255,.05);

        border-right:
        1px solid rgba(255,255,255,.05);
    }

}

</style>

</head>

<body>



<!-- LOGIN -->

<div class="login" id="loginPage">

    <div class="login-box">

        <div class="login-logo">
            ✦
        </div>

        <div class="login-title">
            Astra Connect
        </div>

        <div class="login-sub">
            Secure Workspace Communication
            <br>
            Version 6.0 Enterprise
        </div>

        <input
            id="nameInput"
            class="input"
            placeholder="Tên của bạn..."
        >

        <button
            id="loginBtn"
            class="btn"
        >
            Vào Workspace
        </button>

    </div>

</div>



<!-- APP -->

<div class="app">

    <div class="topbar">

        <div class="top-left">

            <div class="app-logo">
                ✦
            </div>

            <div class="app-info">

                <div class="app-name">
                    Astra Connect
                </div>

                <div class="app-version">
                    v6.0 Enterprise
                </div>

            </div>

        </div>



        <div class="top-center">

            <div
                class="room-badge"
                id="groupTitle"
            >
                ● Nội Bộ
            </div>

        </div>



        <div class="top-right">

            <select
                id="groupSelect"
                class="group-select"
            >

                <option value="NoiBo">
                    Nội Bộ
                </option>

                <option value="KyThuat">
                    Kỹ Thuật
                </option>

                <option value="QuanLy">
                    Quản Lý
                </option>

                <option value="Cafe">
                    Cafe
                </option>

            </select>



            <div
                id="userBox"
                class="user"
            >
                Khách
            </div>



            <button
                id="logoutBtn"
                class="logout"
            >
                ⎋
            </button>

        </div>

    </div>



    <div
        id="messages"
        class="messages"
    ></div>



    <div class="bottom">

        <div class="sendbox">

            <label
                class="image-btn"
                for="imageInput"
            >
                📷
            </label>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >

            <input
                id="messageInput"
                class="send-input"
                placeholder="Nhập tin nhắn..."
            >

            <button
                id="sendBtn"
                class="send-btn"
            >
                ➤
            </button>

        </div>

    </div>

</div>



<!-- IMAGE VIEWER -->

<div
    id="imageViewer"
    class="image-viewer"
>

    <img
        id="viewerImage"
        class="viewer-image"
    >

</div>



<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="app.js"></script>

</body>
</html>
