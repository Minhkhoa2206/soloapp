<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>MK LinkBox Realtime</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

body{
    background:#0f172a;
    color:white;
    height:100vh;
    overflow:hidden;
}

.app{
    display:flex;
    flex-direction:column;
    height:100vh;
}

.topbar{
    background:#111827;
    padding:15px 20px;
    border-bottom:1px solid #1e293b;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.logo{
    font-size:20px;
    font-weight:700;
}

.room{
    background:#1e293b;
    padding:8px 14px;
    border-radius:12px;
    font-size:14px;
}

.info{
    background:#172554;
    padding:10px;
    text-align:center;
    font-size:13px;
}

.messages{
    flex:1;
    overflow-y:auto;
    padding:20px;

    display:flex;
    flex-direction:column;
    gap:12px;
}

.msg{
    max-width:80%;
    padding:12px 15px;
    border-radius:18px;
    animation:fade .2s ease;
    word-wrap:break-word;
}

.mine{
    background:#2563eb;
    align-self:flex-end;
}

.other{
    background:#1e293b;
    align-self:flex-start;
}

.time{
    font-size:11px;
    opacity:.6;
    margin-top:5px;
}

.bottom{
    background:#111827;
    border-top:1px solid #1e293b;

    padding:15px;

    display:flex;
    gap:10px;
}

input{
    flex:1;
    border:none;
    outline:none;

    padding:14px;

    border-radius:14px;

    background:#1e293b;
    color:white;

    font-size:15px;
}

button{
    border:none;
    background:#2563eb;
    color:white;

    padding:0 22px;

    border-radius:14px;

    font-weight:700;
    cursor:pointer;

    transition:.2s;
}

button:hover{
    transform:scale(1.05);
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

</style>
</head>

<body>

<div class="app">

    <div class="topbar">
        <div class="logo">
            ⚡ MK LinkBox
        </div>

        <div class="room" id="roomText">
            Room: loading...
        </div>
    </div>

    <div class="info">
        Chat realtime giữa nhiều thiết bị 😏
    </div>

    <div class="messages" id="messages"></div>

    <div class="bottom">

        <input
            type="text"
            id="messageInput"
            placeholder="Nhập tin nhắn..."
        >

        <button onclick="sendMessage()">
            Gửi
        </button>

    </div>

</div>



<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onChildAdded
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";


// =======================
// FIREBASE CONFIG
// =======================

const firebaseConfig = {

  apiKey: "AIzaSyBkRFn4i_tPSFKUMhC_xVWrL2u43gBPLqM",

  authDomain: "vercel-mk.firebaseapp.com",

  databaseURL: "https://vercel-mk-default-rtdb.firebaseio.com",

  projectId: "vercel-mk",

  storageBucket: "vercel-mk.firebasestorage.app",

  messagingSenderId: "1041836554984",

  appId: "1:1041836554984:web:da8011543b29b8f47ae75d"
};


// =======================
// INIT FIREBASE
// =======================

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);


// =======================
// ROOM
// =======================

let room = localStorage.getItem("room");

if(!room){

    room = prompt(
        "Nhập tên room:",
        "phongchung"
    );

    localStorage.setItem("room", room);
}

document.getElementById("roomText")
.innerText = "Room: " + room;


// =======================
// USER
// =======================

const myId = Math.random()
.toString(36)
.slice(2);


// =======================
// ELEMENT
// =======================

const messages =
document.getElementById("messages");

const input =
document.getElementById("messageInput");


// =======================
// SEND MESSAGE
// =======================

window.sendMessage = function(){

    const text = input.value.trim();

    if(!text) return;

    push(
        ref(db, "rooms/" + room),
        {
            text,
            user: myId,
            time: Date.now()
        }
    );

    input.value = "";
};


// =======================
// RECEIVE MESSAGE
// =======================

onChildAdded(
    ref(db, "rooms/" + room),

    (snapshot)=>{

        const data = snapshot.val();

        const div =
        document.createElement("div");

        div.className =
        "msg " +
        (
            data.user === myId
            ? "mine"
            : "other"
        );

        const date =
        new Date(data.time);

        div.innerHTML = `
            <div>
                ${escapeHtml(data.text)}
            </div>

            <div class="time">
                ${date.getHours()}:
                ${String(
                    date.getMinutes()
                ).padStart(2,'0')}
            </div>
        `;

        messages.appendChild(div);

        messages.scrollTop =
        messages.scrollHeight;
    }
);


// =======================
// ENTER SEND
// =======================

input.addEventListener(
    "keydown",
    (e)=>{

        if(e.key === "Enter"){

            sendMessage();
        }
    }
);


// =======================
// SAFE HTML
// =======================

function escapeHtml(text){

    return text
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;");
}

</script>

</body>
</html>
