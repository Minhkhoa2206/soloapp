<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>

<title>Nội Bộ Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0f172a;
    --card:#111827;
    --card2:#1e293b;
    --blue:#2563eb;
    --line:#334155;
    --text:#ffffff;
    --sub:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html,body{
    width:100%;
    height:100%;
    background:var(--bg);
    overflow:hidden;
}

body{
    color:var(--text);
}



/* =========================
LOGIN
========================= */

.login{
    position:fixed;
    inset:0;

    background:
    linear-gradient(
        135deg,
        #020617,
        #0f172a
    );

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:999;
    padding:20px;
}

.login-box{

    width:100%;
    max-width:420px;

    background:rgba(17,24,39,.95);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.05);

    border-radius:28px;

    padding:28px;

    box-shadow:
    0 10px 40px rgba(0,0,0,.4);

    display:flex;
    flex-direction:column;
    gap:18px;
}

.login-logo{
    width:80px;
    height:80px;

    border-radius:24px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;

    margin:auto;
}

.login-title{
    text-align:center;
    font-size:30px;
    font-weight:800;
}

.login-sub{
    text-align:center;
    color:var(--sub);
    line-height:1.5;
    font-size:14px;
}

.input{
    width:100%;

    background:var(--card2);

    border:1px solid transparent;

    color:white;

    padding:15px 16px;

    border-radius:16px;

    outline:none;

    font-size:15px;

    transition:.2s;
}

.input:focus{
    border-color:#2563eb;
}

.btn{
    border:none;
    outline:none;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    color:white;

    font-weight:700;

    padding:15px;

    border-radius:16px;

    cursor:pointer;

    font-size:15px;

    transition:.2s;
}

.btn:hover{
    transform:translateY(-2px);
}



/* =========================
APP
========================= */

.app{
    width:100%;
    height:100vh;

    display:flex;
    flex-direction:column;
}



/* =========================
TOPBAR
========================= */

.topbar{

    height:72px;

    background:rgba(17,24,39,.95);

    backdrop-filter:blur(10px);

    border-bottom:1px solid rgba(255,255,255,.05);

    padding:0 18px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    flex-shrink:0;
}

.top-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{

    width:46px;
    height:46px;

    border-radius:16px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1e40af
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
}

.chat-info{
    display:flex;
    flex-direction:column;
}

.chat-title{
    font-size:18px;
    font-weight:700;
}

.chat-status{
    font-size:13px;
    color:#4ade80;
}

.user-box{

    background:var(--card2);

    padding:10px 14px;

    border-radius:14px;

    font-size:13px;
    color:#cbd5e1;

    max-width:150px;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}



/* =========================
MESSAGES
========================= */

.messages{

    flex:1;

    overflow-y:auto;

    padding:18px;

    display:flex;
    flex-direction:column;

    gap:14px;

    scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
    width:6px;
}

.messages::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:10px;
}

.message-row{
    display:flex;
}

.message-row.mine{
    justify-content:flex-end;
}

.message{

    max-width:min(75%, 420px);

    padding:12px 14px;

    border-radius:20px;

    animation:fade .2s ease;

    word-break:break-word;
}

.message.mine{
    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    border-bottom-right-radius:6px;
}

.message.other{
    background:var(--card2);
    border-bottom-left-radius:6px;
}

.message-name{
    font-size:13px;
    font-weight:700;

    margin-bottom:6px;

    color:#93c5fd;
}

.message-text{
    line-height:1.5;
    font-size:15px;
}

.message-time{
    margin-top:7px;
    font-size:11px;
    opacity:.65;
}



/* =========================
BOTTOM
========================= */

.bottom{

    background:rgba(17,24,39,.95);

    backdrop-filter:blur(10px);

    border-top:1px solid rgba(255,255,255,.05);

    padding:14px;

    flex-shrink:0;
}

.send-box{
    display:flex;
    align-items:center;
    gap:12px;
}

.send-input{

    flex:1;

    background:var(--card2);

    border:none;
    outline:none;

    color:white;

    padding:15px 18px;

    border-radius:18px;

    font-size:15px;
}

.send-btn{

    min-width:56px;
    height:56px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    color:white;

    font-size:18px;

    cursor:pointer;

    transition:.2s;
}

.send-btn:hover{
    transform:scale(1.05);
}



/* =========================
ANIMATION
========================= */

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}



/* =========================
MOBILE
========================= */

@media(max-width:700px){

    .topbar{
        height:66px;
        padding:0 12px;
    }

    .avatar{
        width:42px;
        height:42px;
    }

    .chat-title{
        font-size:16px;
    }

    .message{
        max-width:88%;
    }

    .messages{
        padding:14px;
    }

    .bottom{
        padding:12px;
    }

    .send-btn{
        min-width:52px;
        height:52px;
    }

    .user-box{
        max-width:100px;
        font-size:12px;
    }

}



/* =========================
PC
========================= */

@media(min-width:1000px){

    .app{
        max-width:1100px;
        margin:auto;

        border-left:1px solid rgba(255,255,255,.05);
        border-right:1px solid rgba(255,255,255,.05);
    }

}

</style>
</head>

<body>



<!-- LOGIN -->

<div class="login" id="loginPage">

    <div class="login-box">

        <div class="login-logo">
            ⚡
        </div>

        <div class="login-title">
            Nội Bộ
        </div>

        <div class="login-sub">
            Hệ thống chat realtime đa thiết bị dành cho nhóm nội bộ 😏
        </div>

        <input
            class="input"
            id="nameInput"
            placeholder="Tên của bạn..."
        >

        <button
            class="btn"
            onclick="login()"
        >
            Vào Chat
        </button>

    </div>

</div>



<!-- APP -->

<div class="app">

    <div class="topbar">

        <div class="top-left">

            <div class="avatar">
                💬
            </div>

            <div class="chat-info">

                <div class="chat-title">
                    Nội Bộ
                </div>

                <div class="chat-status">
                    ● Realtime Online
                </div>

            </div>

        </div>

        <div class="user-box" id="userBox">
            Chưa đăng nhập
        </div>

    </div>



    <div class="messages" id="messages"></div>



    <div class="bottom">

        <div class="send-box">

            <input
                type="text"
                id="messageInput"
                class="send-input"
                placeholder="Nhập tin nhắn..."
            >

            <button
                class="send-btn"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </div>

</div>





<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onChildAdded
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";



// ======================
// FIREBASE
// ======================

const firebaseConfig = {

    apiKey: "AIzaSyBkRFn4i_tPSFKUMhC_xVWrL2u43gBPLqM",

    authDomain: "vercel-mk.firebaseapp.com",

    databaseURL:
    "https://vercel-mk-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId: "vercel-mk",

    storageBucket: "vercel-mk.firebasestorage.app",

    messagingSenderId: "1041836554984",

    appId:
    "1:1041836554984:web:da8011543b29b8f47ae75d"
};

const app = initializeApp(firebaseConfig);

const db = getDatabase(app);



// ======================
// ROOM
// ======================

const room = "NoiBo";



// ======================
// USER
// ======================

let username =
localStorage.getItem("mk_username");

const userId =
Math.random()
.toString(36)
.slice(2);



// ======================
// ELEMENT
// ======================

const loginPage =
document.getElementById("loginPage");

const nameInput =
document.getElementById("nameInput");

const userBox =
document.getElementById("userBox");

const messages =
document.getElementById("messages");

const input =
document.getElementById("messageInput");



// ======================
// AUTO LOGIN
// ======================

if(username){

    loginPage.style.display = "none";

    userBox.innerText = username;
}



// ======================
// LOGIN
// ======================

window.login = function(){

    const name =
    nameInput.value.trim();

    if(!name){

        alert("Nhập tên đi 😭");

        return;
    }

    username = name;

    localStorage.setItem(
        "mk_username",
        username
    );

    userBox.innerText = username;

    loginPage.style.display = "none";
};



// ======================
// SEND
// ======================

window.sendMessage = function(){

    if(!username){

        alert("Chưa đăng nhập 😭");

        return;
    }

    const text =
    input.value.trim();

    if(!text) return;

    push(

        ref(
            db,
            "rooms/" + room
        ),

        {

            name: username,

            text: text,

            user: userId,

            time: Date.now()
        }

    );

    input.value = "";
};



// ======================
// RECEIVE
// ======================

onChildAdded(

    ref(
        db,
        "rooms/" + room
    ),

    (snapshot)=>{

        const data =
        snapshot.val();

        const row =
        document.createElement("div");

        row.className =
        "message-row " +
        (
            data.user === userId
            ? "mine"
            : ""
        );

        const date =
        new Date(data.time);

        row.innerHTML = `

            <div class="
                message
                ${
                    data.user === userId
                    ? "mine"
                    : "other"
                }
            ">

                <div class="message-name">
                    ${escapeHtml(data.name)}
                </div>

                <div class="message-text">
                    ${escapeHtml(data.text)}
                </div>

                <div class="message-time">

                    ${date.getHours()}:
                    ${String(
                        date.getMinutes()
                    ).padStart(2,'0')}

                </div>

            </div>

        `;

        messages.appendChild(row);

        messages.scrollTop =
        messages.scrollHeight;
    }
);



// ======================
// ENTER SEND
// ======================

input.addEventListener(
    "keydown",
    (e)=>{

        if(e.key === "Enter"){

            sendMessage();
        }

    }
);



// ======================
// SAFE HTML
// ======================

function escapeHtml(text){

    return text

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;");
}

</script>

</body>
</html>
