<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover"
/>

<title>Nội Bộ Chat v2.0</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0f172a;
    --card:#111827;
    --card2:#1e293b;
    --blue:#2563eb;
    --green:#22c55e;
    --red:#dc2626;
    --text:#fff;
    --sub:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
}

body{
    color:white;
}



/* =====================
APP
===================== */

.app{
    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;
}



/* =====================
LOGIN
===================== */

.login{

    position:fixed;
    inset:0;

    background:
    linear-gradient(
        135deg,
        #020617,
        #0f172a
    );

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:999;

    padding:20px;
}

.login-box{

    width:100%;
    max-width:400px;

    background:#111827;

    border:1px solid rgba(255,255,255,.05);

    border-radius:28px;

    padding:26px;

    display:flex;
    flex-direction:column;

    gap:18px;
}

.login-logo{

    width:80px;
    height:80px;

    margin:auto;

    border-radius:24px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;
}

.login-title{
    text-align:center;
    font-size:30px;
    font-weight:800;
}

.login-sub{
    text-align:center;
    color:var(--sub);
    font-size:14px;
    line-height:1.5;
}

.input{

    width:100%;

    border:none;
    outline:none;

    background:var(--card2);

    color:white;

    padding:15px;

    border-radius:16px;

    font-size:15px;
}

.btn{

    border:none;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    color:white;

    padding:15px;

    border-radius:16px;

    font-weight:700;

    cursor:pointer;
}



/* =====================
TOPBAR
===================== */

.topbar{

    background:#111827;

    border-bottom:
    1px solid rgba(255,255,255,.05);

    padding:14px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;
}

.left{
    display:flex;
    align-items:center;
    gap:12px;
}

.logo{

    width:46px;
    height:46px;

    border-radius:16px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
}

.title{
    font-size:18px;
    font-weight:700;
}

.version{
    font-size:11px;
    color:#60a5fa;
}

.status{
    font-size:12px;
    color:var(--green);
}

.right{
    display:flex;
    align-items:center;
    gap:8px;
}

.group-select{

    border:none;
    outline:none;

    background:var(--card2);

    color:white;

    padding:10px 12px;

    border-radius:12px;
}

.user{

    background:var(--card2);

    padding:10px 12px;

    border-radius:12px;

    font-size:13px;

    max-width:120px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.logout{

    border:none;

    background:var(--red);

    color:white;

    padding:10px 14px;

    border-radius:12px;

    cursor:pointer;

    font-weight:700;
}



/* =====================
MESSAGES
===================== */

.messages{

    flex:1;

    overflow-y:auto;

    padding:16px;

    display:flex;
    flex-direction:column;

    gap:12px;
}

.messages::-webkit-scrollbar{
    width:6px;
}

.messages::-webkit-scrollbar-thumb{
    background:#334155;
    border-radius:10px;
}

.row{
    display:flex;
}

.row.me{
    justify-content:flex-end;
}

.msg{

    max-width:80%;

    background:var(--card2);

    padding:12px;

    border-radius:18px;

    animation:fade .2s ease;
}

.row.me .msg{

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );
}

.name{
    font-size:13px;
    font-weight:700;

    margin-bottom:6px;

    color:#93c5fd;
}

.text{
    line-height:1.5;
    word-break:break-word;
}

.time{
    margin-top:6px;
    font-size:11px;
    opacity:.7;
}



/* =====================
BOTTOM
===================== */

.bottom{

    background:#111827;

    border-top:
    1px solid rgba(255,255,255,.05);

    padding:12px;

    padding-bottom:
    calc(
        env(safe-area-inset-bottom)
        + 12px
    );
}

.sendbox{
    display:flex;
    gap:10px;
}

.send-input{

    flex:1;

    border:none;
    outline:none;

    background:var(--card2);

    color:white;

    padding:15px;

    border-radius:18px;

    font-size:15px;
}

.send-btn{

    width:56px;

    border:none;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    color:white;

    border-radius:18px;

    cursor:pointer;

    font-size:18px;
}



/* =====================
ANIMATION
===================== */

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}



/* =====================
MOBILE
===================== */

@media(max-width:700px){

    .topbar{
        flex-wrap:wrap;
    }

    .right{
        width:100%;
        overflow:auto;
    }

    .msg{
        max-width:92%;
    }

}

</style>
</head>

<body>



<!-- LOGIN -->

<div class="login" id="loginPage">

    <div class="login-box">

        <div class="login-logo">
            ⚡
        </div>

        <div class="login-title">
            Nội Bộ
        </div>

        <div class="login-sub">
            Hệ thống chat realtime đa thiết bị
            <br>
            Version 2.0 😏
        </div>

        <input
            id="nameInput"
            class="input"
            placeholder="Tên của bạn..."
        >

        <button
            id="loginBtn"
            class="btn"
        >
            Vào Chat
        </button>

    </div>

</div>



<!-- APP -->

<div class="app">

    <div class="topbar">

        <div class="left">

            <div class="logo">
                💬
            </div>

            <div>

                <div class="title">
                    Nội Bộ
                </div>

                <div class="version">
                    Version 2.0
                </div>

                <div
                    class="status"
                    id="groupTitle"
                >
                    ● Nội Bộ
                </div>

            </div>

        </div>

        <div class="right">

            <select
                id="groupSelect"
                class="group-select"
            >

                <option value="NoiBo">
                    Nội Bộ
                </option>

                <option value="KyThuat">
                    Kỹ Thuật
                </option>

                <option value="QuanLy">
                    Quản Lý
                </option>

                <option value="Cafe">
                    Cafe
                </option>

            </select>

            <div
                id="userBox"
                class="user"
            >
                Khách
            </div>

            <button
                id="logoutBtn"
                class="logout"
            >
                Thoát
            </button>

        </div>

    </div>



    <div
        id="messages"
        class="messages"
    ></div>



    <div class="bottom">

        <div class="sendbox">

            <input
                id="messageInput"
                class="send-input"
                placeholder="Nhập tin nhắn..."
            >

            <button
                id="sendBtn"
                class="send-btn"
            >
                ➤
            </button>

        </div>

    </div>

</div>





<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

/* =====================
FIREBASE
===================== */

firebase.initializeApp({

    apiKey:
    "AIzaSyBkRFn4i_tPSFKUMhC_xVWrL2u43gBPLqM",

    authDomain:
    "vercel-mk.firebaseapp.com",

    databaseURL:
    "https://vercel-mk-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "vercel-mk",

    storageBucket:
    "vercel-mk.firebasestorage.app",

    messagingSenderId:
    "1041836554984",

    appId:
    "1:1041836554984:web:da8011543b29b8f47ae75d"

});

const db =
firebase.database();



/* =====================
ELEMENT
===================== */

const loginPage =
document.getElementById("loginPage");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const sendBtn =
document.getElementById("sendBtn");

const nameInput =
document.getElementById("nameInput");

const userBox =
document.getElementById("userBox");

const messages =
document.getElementById("messages");

const messageInput =
document.getElementById("messageInput");

const groupSelect =
document.getElementById("groupSelect");

const groupTitle =
document.getElementById("groupTitle");



/* =====================
DATA
===================== */

let username =
localStorage.getItem("mk_username");

let room =
localStorage.getItem("mk_room")
|| "NoiBo";

const userId =
Math.random()
.toString(36)
.slice(2);



/* =====================
INIT
===================== */

groupSelect.value = room;

groupTitle.innerHTML =
"● " +
groupSelect.options[
groupSelect.selectedIndex
].text;

if(username){

    loginPage.style.display =
    "none";

    userBox.innerText =
    username;
}



/* =====================
LOGIN
===================== */

loginBtn.addEventListener(

    "click",

    ()=>{

        const name =
        nameInput.value.trim();

        if(!name){

            alert("Nhập tên 😭");

            return;
        }

        username = name;

        localStorage.setItem(
            "mk_username",
            username
        );

        userBox.innerText =
        username;

        loginPage.style.display =
        "none";
    }

);



/* =====================
LOGOUT
===================== */

logoutBtn.addEventListener(

    "click",

    ()=>{

        localStorage.removeItem(
            "mk_username"
        );

        location.reload();
    }

);



/* =====================
GROUP
===================== */

groupSelect.addEventListener(

    "change",

    ()=>{

        localStorage.setItem(
            "mk_room",
            groupSelect.value
        );

        location.reload();
    }

);



/* =====================
SEND
===================== */

function sendMessage(){

    if(!username){

        alert("Đăng nhập 😭");

        return;
    }

    const text =
    messageInput.value.trim();

    if(!text) return;

    db.ref(
        "rooms/" + room
    ).push({

        name:username,

        text:text,

        user:userId,

        time:Date.now()
    });

    messageInput.value = "";
}

sendBtn.addEventListener(
    "click",
    sendMessage
);

messageInput.addEventListener(

    "keydown",

    (e)=>{

        if(e.key === "Enter"){

            sendMessage();
        }

    }

);



/* =====================
RECEIVE
===================== */

db.ref(
    "rooms/" + room
).on(

    "child_added",

    (snapshot)=>{

        const data =
        snapshot.val();

        const row =
        document.createElement("div");

        row.className =
        "row " +
        (
            data.user === userId
            ? "me"
            : ""
        );

        const date =
        new Date(data.time);

        row.innerHTML = `

            <div class="msg">

                <div class="name">
                    ${safe(data.name)}
                </div>

                <div class="text">
                    ${safe(data.text)}
                </div>

                <div class="time">

                    ${date.getHours()}:
                    ${String(
                        date.getMinutes()
                    ).padStart(2,'0')}

                </div>

            </div>

        `;

        messages.appendChild(row);

        messages.scrollTop =
        messages.scrollHeight;
    }

);



/* =====================
SAFE HTML
===================== */

function safe(text){

    return text

    .replace(/</g,"&lt;")

    .replace(/>/g,"&gt;");
}

</script>

</body>
</html>
