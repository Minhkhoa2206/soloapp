<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1,
viewport-fit=cover
"
/>

<title>Astra Connect</title>

<link
rel="stylesheet"
href="style.css"
/>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet"
/>

</head>

<body>



<!-- LOGIN -->

<div class="login" id="loginPage">

    <div class="login-box">

        <div class="login-logo">
            ✦
        </div>

        <div class="login-title">
            Astra Connect
        </div>

        <div class="login-sub">
            Secure Workspace Communication
            <br>
            Version 6.5 Enterprise
        </div>

        <input
            id="nameInput"
            class="input"
            placeholder="Tên của bạn..."
        >

        <button
            id="loginBtn"
            class="btn"
        >
            Vào Workspace
        </button>

    </div>

</div>



<!-- APP -->

<div class="app">

    <div class="topbar">

        <div class="top-left">

            <div class="app-logo">
                ✦
            </div>

            <div class="app-info">

                <div class="app-name">
                    Astra Connect
                </div>

                <div class="app-version">
                    v6.0 Enterprise
                </div>

            </div>

        </div>



        <div class="top-center">

            <div
                class="room-badge"
                id="groupTitle"
            >
                ● Nội Bộ
            </div>

        </div>



        <div class="top-right">

            <select
                id="groupSelect"
                class="group-select"
            >

                <option value="NoiBo">
                    Nội Bộ
                </option>

                <option value="KyThuat">
                    Kỹ Thuật
                </option>

                <option value="QuanLy">
                    Quản Lý
                </option>

                <option value="Cafe">
                    Cafe
                </option>

            </select>



            <div
                id="userBox"
                class="user"
            >
                Khách
            </div>



            <button
                id="logoutBtn"
                class="logout"
            >
                ⎋
            </button>

        </div>

    </div>



    <div
        id="messages"
        class="messages"
    ></div>



    <div class="bottom">

        <div class="sendbox">

            <label
                class="image-btn"
                for="imageInput"
            >
                📷
            </label>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >

            <input
                id="messageInput"
                class="send-input"
                placeholder="Nhập tin nhắn..."
            >

            <button
                id="sendBtn"
                class="send-btn"
            >
                ➤
            </button>

        </div>

    </div>

</div>



<!-- IMAGE VIEWER -->

<div
    id="imageViewer"
    class="image-viewer"
>

    <img
        id="viewerImage"
        class="viewer-image"
    >

</div>



<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="app.js"></script>

</body>
</html>
