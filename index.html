<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover"
/>

<title>Nội Bộ Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

body{
    background:#0f172a;
    color:white;
    height:100vh;
    overflow:hidden;
}

.app{
    height:100dvh;
    display:flex;
    flex-direction:column;
}

.topbar{
    background:#111827;
    padding:14px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    border-bottom:1px solid #1e293b;
}

.left{
    display:flex;
    align-items:center;
    gap:10px;
}

.logo{
    width:42px;
    height:42px;

    border-radius:14px;

    background:#2563eb;

    display:flex;
    justify-content:center;
    align-items:center;

    font-size:18px;
}

.title{
    font-size:18px;
    font-weight:700;
}

.status{
    font-size:12px;
    color:#4ade80;
}

.right{
    display:flex;
    align-items:center;
    gap:8px;
}

select,
.user{

    background:#1e293b;

    border:none;
    outline:none;

    color:white;

    padding:10px 12px;

    border-radius:12px;
}

.logout{

    border:none;

    background:#dc2626;

    color:white;

    padding:10px 14px;

    border-radius:12px;

    cursor:pointer;
}

.messages{

    flex:1;

    overflow-y:auto;

    padding:16px;

    display:flex;
    flex-direction:column;

    gap:12px;
}

.row{
    display:flex;
}

.row.me{
    justify-content:flex-end;
}

.msg{

    max-width:80%;

    background:#1e293b;

    padding:12px;

    border-radius:18px;
}

.me .msg{
    background:#2563eb;
}

.name{
    font-size:13px;
    font-weight:700;

    margin-bottom:6px;
}

.time{
    font-size:11px;
    opacity:.7;

    margin-top:6px;
}

.bottom{

    background:#111827;

    padding:12px;

    border-top:1px solid #1e293b;
}

.sendbox{
    display:flex;
    gap:10px;
}

.sendbox input{

    flex:1;

    border:none;
    outline:none;

    background:#1e293b;

    color:white;

    padding:14px;

    border-radius:16px;

    font-size:15px;
}

.sendbox button{

    width:56px;

    border:none;

    background:#2563eb;

    color:white;

    border-radius:16px;

    cursor:pointer;
}



/* LOGIN */

.login{

    position:fixed;
    inset:0;

    background:#020617;

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:999;
}

.login-box{

    width:90%;
    max-width:380px;

    background:#111827;

    padding:24px;

    border-radius:24px;

    display:flex;
    flex-direction:column;

    gap:16px;
}

.login-title{
    text-align:center;
    font-size:28px;
    font-weight:700;
}

.login-box input{

    border:none;
    outline:none;

    background:#1e293b;

    color:white;

    padding:15px;

    border-radius:16px;
}

.login-box button{

    border:none;

    background:#2563eb;

    color:white;

    padding:15px;

    border-radius:16px;

    font-weight:700;

    cursor:pointer;
}

@media(max-width:700px){

    .topbar{
        flex-wrap:wrap;
        gap:10px;
    }

    .right{
        width:100%;
        overflow:auto;
    }

    .msg{
        max-width:92%;
    }

}

</style>
</head>

<body>



<!-- LOGIN -->

<div class="login" id="loginPage">

    <div class="login-box">

        <div class="login-title">
            ⚡ Nội Bộ
        </div>

        <input
            id="nameInput"
            placeholder="Tên của bạn..."
        >

        <button id="loginBtn">
            Vào Chat
        </button>

    </div>

</div>



<!-- APP -->

<div class="app">

    <div class="topbar">

        <div class="left">

            <div class="logo">
                💬
            </div>

            <div>

                <div class="title" id="groupTitle">
                    Nội Bộ
                </div>

                <div class="status">
                    ● Realtime
                </div>

            </div>

        </div>

        <div class="right">

            <select id="groupSelect">

                <option value="NoiBo">
                    Nội Bộ
                </option>

                <option value="KyThuat">
                    Kỹ Thuật
                </option>

                <option value="QuanLy">
                    Quản Lý
                </option>

            </select>

            <div class="user" id="userBox">
                Khách
            </div>

            <button
                class="logout"
                id="logoutBtn"
            >
                Thoát
            </button>

        </div>

    </div>



    <div
        class="messages"
        id="messages"
    ></div>



    <div class="bottom">

        <div class="sendbox">

            <input
                id="messageInput"
                placeholder="Nhập tin nhắn..."
            >

            <button id="sendBtn">
                ➤
            </button>

        </div>

    </div>

</div>





<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>

/* FIREBASE */

firebase.initializeApp({

    apiKey:
    "AIzaSyBkRFn4i_tPSFKUMhC_xVWrL2u43gBPLqM",

    authDomain:
    "vercel-mk.firebaseapp.com",

    databaseURL:
    "https://vercel-mk-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "vercel-mk",

    storageBucket:
    "vercel-mk.firebasestorage.app",

    messagingSenderId:
    "1041836554984",

    appId:
    "1:1041836554984:web:da8011543b29b8f47ae75d"

});

const db =
firebase.database();



/* ELEMENT */

const loginPage =
document.getElementById("loginPage");

const loginBtn =
document.getElementById("loginBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const sendBtn =
document.getElementById("sendBtn");

const nameInput =
document.getElementById("nameInput");

const userBox =
document.getElementById("userBox");

const messages =
document.getElementById("messages");

const messageInput =
document.getElementById("messageInput");

const groupSelect =
document.getElementById("groupSelect");

const groupTitle =
document.getElementById("groupTitle");



/* USER */

let username =
localStorage.getItem("mk_username");

let room =
localStorage.getItem("mk_room")
|| "NoiBo";

const userId =
Math.random().toString(36).slice(2);



/* INIT */

groupSelect.value = room;

groupTitle.innerText =
groupSelect.options[
groupSelect.selectedIndex
].text;

if(username){

    loginPage.style.display =
    "none";

    userBox.innerText =
    username;
}



/* LOGIN */

loginBtn.onclick = ()=>{

    const name =
    nameInput.value.trim();

    if(!name){

        alert("Nhập tên 😭");

        return;
    }

    username = name;

    localStorage.setItem(
        "mk_username",
        username
    );

    userBox.innerText =
    username;

    loginPage.style.display =
    "none";
};



/* LOGOUT */

logoutBtn.onclick = ()=>{

    localStorage.removeItem(
        "mk_username"
    );

    location.reload();
};



/* GROUP */

groupSelect.onchange = ()=>{

    localStorage.setItem(
        "mk_room",
        groupSelect.value
    );

    location.reload();
};



/* SEND */

function sendMessage(){

    if(!username){

        alert("Đăng nhập đi 😭");

        return;
    }

    const text =
    messageInput.value.trim();

    if(!text) return;

    db.ref(
        "rooms/" + room
    ).push({

        name:username,

        text:text,

        user:userId,

        time:Date.now()
    });

    messageInput.value = "";
}

sendBtn.onclick =
sendMessage;

messageInput.addEventListener(
    "keydown",
    (e)=>{

        if(e.key === "Enter"){

            sendMessage();
        }

    }
);



/* RECEIVE */

db.ref(
    "rooms/" + room
).on(

    "child_added",

    (snapshot)=>{

        const data =
        snapshot.val();

        const row =
        document.createElement("div");

        row.className =
        "row " +
        (
            data.user === userId
            ? "me"
            : ""
        );

        const date =
        new Date(data.time);

        row.innerHTML = `

            <div class="msg">

                <div class="name">
                    ${safe(data.name)}
                </div>

                <div>
                    ${safe(data.text)}
                </div>

                <div class="time">

                    ${date.getHours()}:
                    ${String(
                        date.getMinutes()
                    ).padStart(2,'0')}

                </div>

            </div>

        `;

        messages.appendChild(row);

        messages.scrollTop =
        messages.scrollHeight;
    }
);



function safe(text){

    return text

    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;");
}

</script>

</body>
</html>

V1
