<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8"/>

<meta
name="viewport"
content="
width=device-width,
initial-scale=1,
viewport-fit=cover
"
/>

<title>Nội Bộ Chat</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#0f172a;
    --card:#111827;
    --card2:#1e293b;
    --blue:#2563eb;
    --red:#dc2626;
    --text:#fff;
    --sub:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Inter',sans-serif;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:var(--bg);
}

body{
    position:fixed;
    inset:0;
    color:var(--text);
}



/* =====================
LOGIN
===================== */

.login{
    position:fixed;
    inset:0;

    background:
    linear-gradient(
        135deg,
        #020617,
        #0f172a
    );

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:999;
    padding:20px;
}

.login-box{

    width:100%;
    max-width:420px;

    background:rgba(17,24,39,.96);

    border:1px solid rgba(255,255,255,.05);

    border-radius:28px;

    padding:28px;

    display:flex;
    flex-direction:column;
    gap:18px;
}

.login-logo{

    width:80px;
    height:80px;

    margin:auto;

    border-radius:24px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:34px;
}

.login-title{
    text-align:center;
    font-size:30px;
    font-weight:800;
}

.login-sub{
    text-align:center;
    color:var(--sub);
    line-height:1.5;
    font-size:14px;
}

.input{

    width:100%;

    border:none;
    outline:none;

    background:var(--card2);

    color:white;

    padding:15px;

    border-radius:16px;

    font-size:15px;
}

.btn{

    border:none;
    outline:none;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    color:white;

    padding:15px;

    border-radius:16px;

    font-size:15px;
    font-weight:700;

    cursor:pointer;
}



/* =====================
APP
===================== */

.app{
    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;
}



/* =====================
TOPBAR
===================== */

.topbar{

    height:72px;

    background:rgba(17,24,39,.96);

    border-bottom:1px solid rgba(255,255,255,.05);

    padding:0 14px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
}

.top-left{
    display:flex;
    align-items:center;
    gap:12px;
}

.avatar{

    width:46px;
    height:46px;

    border-radius:16px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:20px;
}

.chat-info{
    display:flex;
    flex-direction:column;
}

.chat-title{
    font-size:18px;
    font-weight:700;
}

.chat-status{
    font-size:12px;
    color:#4ade80;
}

.top-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.group-select{

    background:var(--card2);

    border:none;
    outline:none;

    color:white;

    padding:10px 12px;

    border-radius:12px;

    font-size:13px;
}

.user-box{

    background:var(--card2);

    padding:10px 12px;

    border-radius:12px;

    font-size:13px;

    max-width:120px;

    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
}

.logout-btn{

    border:none;

    background:var(--red);

    color:white;

    padding:10px 12px;

    border-radius:12px;

    cursor:pointer;

    font-size:13px;
    font-weight:700;
}



/* =====================
MESSAGES
===================== */

.messages{

    flex:1;

    overflow-y:auto;

    padding:18px;

    display:flex;
    flex-direction:column;

    gap:14px;
}

.message-row{
    display:flex;
}

.message-row.mine{
    justify-content:flex-end;
}

.message{

    max-width:min(80%,420px);

    padding:12px 14px;

    border-radius:20px;

    word-break:break-word;
}

.message.mine{

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    border-bottom-right-radius:6px;
}

.message.other{

    background:var(--card2);

    border-bottom-left-radius:6px;
}

.message-name{

    font-size:13px;
    font-weight:700;

    margin-bottom:6px;

    color:#93c5fd;
}

.message-text{
    line-height:1.5;
    font-size:15px;
}

.message-time{

    margin-top:7px;

    font-size:11px;

    opacity:.7;
}



/* =====================
BOTTOM
===================== */

.bottom{

    background:rgba(17,24,39,.96);

    border-top:1px solid rgba(255,255,255,.05);

    padding:14px;

    padding-bottom:
    calc(
        env(safe-area-inset-bottom)
        + 12px
    );
}

.send-box{
    display:flex;
    align-items:center;
    gap:10px;
}

.send-input{

    flex:1;

    border:none;
    outline:none;

    background:var(--card2);

    color:white;

    padding:15px;

    border-radius:18px;

    font-size:16px;
}

.send-btn{

    min-width:56px;
    height:56px;

    border:none;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );

    color:white;

    font-size:18px;

    cursor:pointer;
}



/* =====================
MOBILE
===================== */

@media(max-width:700px){

    .topbar{
        height:auto;
        padding:12px;
        flex-wrap:wrap;
    }

    .top-right{
        width:100%;
        overflow-x:auto;
    }

    .message{
        max-width:90%;
    }

    .messages{
        padding:14px;
    }

    .send-btn{
        min-width:52px;
        height:52px;
    }

}

</style>
</head>

<body>



<!-- LOGIN -->

<div class="login" id="loginPage">

    <div class="login-box">

        <div class="login-logo">
            ⚡
        </div>

        <div class="login-title">
            Nội Bộ
        </div>

        <div class="login-sub">
            Hệ thống chat realtime đa thiết bị 😏
        </div>

        <input
            class="input"
            id="nameInput"
            placeholder="Tên của bạn..."
        >

        <button
            class="btn"
            onclick="login()"
        >
            Vào Chat
        </button>

    </div>

</div>





<!-- APP -->

<div class="app">

    <div class="topbar">

        <div class="top-left">

            <div class="avatar">
                💬
            </div>

            <div class="chat-info">

                <div
                    class="chat-title"
                    id="groupTitle"
                >
                    Nội Bộ
                </div>

                <div class="chat-status">
                    ● Realtime Online
                </div>

            </div>

        </div>

        <div class="top-right">

            <select
                class="group-select"
                id="groupSelect"
            >

                <option value="NoiBo">
                    Nội Bộ
                </option>

                <option value="KyThuat">
                    Kỹ Thuật
                </option>

                <option value="QuanLy">
                    Quản Lý
                </option>

                <option value="Cafe">
                    Cafe
                </option>

            </select>

            <div
                class="user-box"
                id="userBox"
            >
                Chưa đăng nhập
            </div>

            <button
                class="logout-btn"
                onclick="logout()"
            >
                Thoát
            </button>

        </div>

    </div>



    <div
        class="messages"
        id="messages"
    ></div>



    <div class="bottom">

        <div class="send-box">

            <input
                type="text"
                id="messageInput"
                class="send-input"
                placeholder="Nhập tin nhắn..."
            >

            <button
                class="send-btn"
                onclick="sendMessage()"
            >
                ➤
            </button>

        </div>

    </div>

</div>





<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
    getDatabase,
    ref,
    push,
    onChildAdded
}
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";



const firebaseConfig = {

    apiKey:
    "AIzaSyBkRFn4i_tPSFKUMhC_xVWrL2u43gBPLqM",

    authDomain:
    "vercel-mk.firebaseapp.com",

    databaseURL:
    "https://vercel-mk-default-rtdb.asia-southeast1.firebasedatabase.app",

    projectId:
    "vercel-mk",

    storageBucket:
    "vercel-mk.firebasestorage.app",

    messagingSenderId:
    "1041836554984",

    appId:
    "1:1041836554984:web:da8011543b29b8f47ae75d"
};



const app =
initializeApp(firebaseConfig);

const db =
getDatabase(app);



let room =
localStorage.getItem("mk_room")
|| "NoiBo";



let username =
localStorage.getItem("mk_username");

const userId =
Math.random()
.toString(36)
.slice(2);



const loginPage =
document.getElementById("loginPage");

const nameInput =
document.getElementById("nameInput");

const userBox =
document.getElementById("userBox");

const messages =
document.getElementById("messages");

const input =
document.getElementById("messageInput");

const groupSelect =
document.getElementById("groupSelect");

const groupTitle =
document.getElementById("groupTitle");



groupSelect.value = room;

groupTitle.innerText =
groupSelect.options[
groupSelect.selectedIndex
].text;



if(username){

    loginPage.style.display =
    "none";

    userBox.innerText =
    username;
}



/* =====================
LOGIN
===================== */

window.login = function(){

    const name =
    nameInput.value.trim();

    if(!name){

        alert("Nhập tên 😭");

        return;
    }

    username = name;

    localStorage.setItem(
        "mk_username",
        username
    );

    userBox.innerText =
    username;

    loginPage.style.display =
    "none";
};



/* =====================
LOGOUT
===================== */

window.logout = function(){

    localStorage.removeItem(
        "mk_username"
    );

    location.reload();
};



/* =====================
GROUP
===================== */

groupSelect.addEventListener(
    "change",
    ()=>{

        localStorage.setItem(
            "mk_room",
            groupSelect.value
        );

        location.reload();
    }
);



/* =====================
SEND
===================== */

window.sendMessage = function(){

    if(!username){

        alert("Chưa đăng nhập 😭");

        return;
    }

    const text =
    input.value.trim();

    if(!text) return;

    push(

        ref(
            db,
            "rooms/" + room
        ),

        {

            name: username,

            text: text,

            user: userId,

            time: Date.now()
        }

    );

    input.value = "";
};



/* =====================
RECEIVE
===================== */

onChildAdded(

    ref(
        db,
        "rooms/" + room
    ),

    (snapshot)=>{

        const data =
        snapshot.val();

        const row =
        document.createElement("div");

        row.className =
        "message-row " +
        (
            data.user === userId
            ? "mine"
            : ""
        );

        const date =
        new Date(data.time);

        row.innerHTML = `

            <div class="
                message
                ${
                    data.user === userId
                    ? "mine"
                    : "other"
                }
            ">

                <div class="message-name">
                    ${escapeHtml(data.name)}
                </div>

                <div class="message-text">
                    ${escapeHtml(data.text)}
                </div>

                <div class="message-time">

                    ${date.getHours()}:
                    ${String(
                        date.getMinutes()
                    ).padStart(2,'0')}

                </div>

            </div>

        `;

        messages.appendChild(row);

        messages.scrollTop =
        messages.scrollHeight;
    }
);



input.addEventListener(
    "keydown",
    (e)=>{

        if(e.key === "Enter"){

            sendMessage();
        }

    }
);



function escapeHtml(text){

    return text

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;");
}

</script>

</body>
</html>
