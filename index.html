<!DOCTYPE html>
<html lang="vi">
<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="
width=device-width,
initial-scale=1,
viewport-fit=cover
"
/>

<title>Nội Bộ Chat v5.0</title>

<link
href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
rel="stylesheet"
/>

<style>

:root{

    --bg:#0f172a;

    --card:#111827;

    --card2:#1e293b;

    --blue:#2563eb;

    --blue2:#1d4ed8;

    --green:#22c55e;

    --red:#dc2626;

    --text:#ffffff;

    --sub:#94a3b8;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Inter,sans-serif;
}

html,body{

    width:100%;
    height:100%;

    background:var(--bg);

    overflow:hidden;
}

body{
    color:var(--text);
}



/* =========================
APP
========================= */

.app{

    width:100%;
    height:100dvh;

    display:flex;
    flex-direction:column;
}



/* =========================
LOGIN
========================= */

.login{

    position:fixed;
    inset:0;

    background:
    linear-gradient(
        135deg,
        #020617,
        #0f172a
    );

    display:flex;
    justify-content:center;
    align-items:center;

    z-index:99999;

    padding:20px;
}

.login-box{

    width:100%;
    max-width:420px;

    background:rgba(17,24,39,.96);

    border:
    1px solid rgba(255,255,255,.05);

    border-radius:32px;

    padding:28px;

    display:flex;
    flex-direction:column;

    gap:18px;

    box-shadow:
    0 20px 50px rgba(0,0,0,.4);
}

.login-logo{

    width:90px;
    height:90px;

    margin:auto;

    border-radius:28px;

    background:
    linear-gradient(
        135deg,
        var(--blue),
        var(--blue2)
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:38px;
}

.login-title{

    text-align:center;

    font-size:32px;

    font-weight:800;
}

.login-sub{

    text-align:center;

    color:var(--sub);

    line-height:1.5;

    font-size:14px;
}

.input{

    width:100%;

    border:none;
    outline:none;

    background:var(--card2);

    color:white;

    padding:16px;

    border-radius:18px;

    font-size:15px;
}

.btn{

    border:none;

    background:
    linear-gradient(
        135deg,
        var(--blue),
        var(--blue2)
    );

    color:white;

    padding:16px;

    border-radius:18px;

    font-weight:700;

    font-size:15px;

    cursor:pointer;
}



/* =========================
TOPBAR
========================= */

.topbar{

    background:
    rgba(17,24,39,.95);

    backdrop-filter:blur(10px);

    border-bottom:
    1px solid rgba(255,255,255,.05);

    padding:14px;

    display:flex;
    justify-content:space-between;
    align-items:center;

    gap:10px;
}

.left{

    display:flex;
    align-items:center;

    gap:12px;
}

.logo{

    width:50px;
    height:50px;

    border-radius:18px;

    background:
    linear-gradient(
        135deg,
        var(--blue),
        var(--blue2)
    );

    display:flex;
    align-items:center;
    justify-content:center;

    font-size:22px;
}

.title{
    font-size:19px;
    font-weight:700;
}

.version{

    font-size:11px;

    color:#60a5fa;
}

.status{

    font-size:12px;

    color:var(--green);
}

.right{

    display:flex;
    align-items:center;

    gap:8px;
}

.group-select,
.user{

    border:none;
    outline:none;

    background:var(--card2);

    color:white;

    padding:10px 12px;

    border-radius:14px;

    font-size:13px;
}

.logout{

    border:none;

    background:var(--red);

    color:white;

    padding:10px 14px;

    border-radius:14px;

    cursor:pointer;

    font-weight:700;
}



/* =========================
MESSAGES
========================= */

.messages{

    flex:1;

    overflow-y:auto;

    padding:16px;

    display:flex;
    flex-direction:column;

    gap:14px;

    scroll-behavior:smooth;
}

.messages::-webkit-scrollbar{
    width:6px;
}

.messages::-webkit-scrollbar-thumb{

    background:#334155;

    border-radius:10px;
}

.row{
    display:flex;
}

.row.me{
    justify-content:flex-end;
}

.msg{

    max-width:80%;

    background:var(--card2);

    padding:12px;

    border-radius:22px;

    animation:fade .2s ease;
}

.row.me .msg{

    background:
    linear-gradient(
        135deg,
        var(--blue),
        var(--blue2)
    );
}

.name{

    font-size:13px;

    font-weight:700;

    margin-bottom:6px;

    color:#93c5fd;
}

.text{

    line-height:1.6;

    word-break:break-word;

    font-size:15px;
}

.time{

    margin-top:6px;

    font-size:11px;

    opacity:.7;
}

.chat-image{

    width:100%;

    max-width:260px;

    border-radius:16px;

    margin-top:8px;

    cursor:pointer;

    transition:.2s;
}

.chat-image:hover{
    transform:scale(1.02);
}



/* =========================
BOTTOM
========================= */

.bottom{

    background:
    rgba(17,24,39,.95);

    backdrop-filter:blur(10px);

    border-top:
    1px solid rgba(255,255,255,.05);

    padding:12px;

    padding-bottom:
    calc(
        env(safe-area-inset-bottom)
        + 12px
    );
}

.sendbox{

    display:flex;

    gap:10px;

    align-items:center;
}

.image-btn{

    width:56px;
    height:56px;

    background:var(--card2);

    border-radius:18px;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    font-size:20px;

    flex-shrink:0;
}

.send-input{

    flex:1;

    border:none;
    outline:none;

    background:var(--card2);

    color:white;

    padding:16px;

    border-radius:18px;

    font-size:15px;
}

.send-btn{

    width:56px;
    height:56px;

    border:none;

    background:
    linear-gradient(
        135deg,
        var(--blue),
        var(--blue2)
    );

    color:white;

    border-radius:18px;

    cursor:pointer;

    font-size:18px;

    flex-shrink:0;
}



/* =========================
IMAGE VIEWER
========================= */

.image-viewer{

    position:fixed;
    inset:0;

    background:
    rgba(0,0,0,.92);

    display:none;

    justify-content:center;
    align-items:center;

    z-index:999999;

    padding:20px;
}

.viewer-image{

    max-width:100%;
    max-height:100%;

    border-radius:20px;

    object-fit:contain;

    animation:zoom .2s ease;
}



/* =========================
ANIMATION
========================= */

@keyframes fade{

    from{
        opacity:0;
        transform:translateY(10px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }

}

@keyframes zoom{

    from{
        opacity:0;
        transform:scale(.8);
    }

    to{
        opacity:1;
        transform:scale(1);
    }

}



/* =========================
MOBILE
========================= */

@media(max-width:700px){

    .topbar{

        flex-wrap:wrap;

        padding:12px;
    }

    .right{

        width:100%;

        overflow:auto;
    }

    .msg{
        max-width:92%;
    }

    .messages{
        padding:14px;
    }

    .send-input{
        font-size:16px;
    }

    .login-title{
        font-size:28px;
    }

}



/* =========================
PC
========================= */

@media(min-width:1000px){

    .app{

        max-width:1100px;

        margin:auto;

        border-left:
        1px solid rgba(255,255,255,.05);

        border-right:
        1px solid rgba(255,255,255,.05);
    }

}

</style>

</head>

<body>



<!-- LOGIN -->

<div class="login" id="loginPage">

    <div class="login-box">

        <div class="login-logo">
            ⚡
        </div>

        <div class="login-title">
            Nội Bộ
        </div>

        <div class="login-sub">
            Hệ thống chat realtime đa thiết bị
            <br>
            Version 5.0 😏
        </div>

        <input
            id="nameInput"
            class="input"
            placeholder="Tên của bạn..."
        >

        <button
            id="loginBtn"
            class="btn"
        >
            Vào Chat
        </button>

    </div>

</div>



<!-- APP -->

<div class="app">

    <div class="topbar">

        <div class="left">

            <div class="logo">
                💬
            </div>

            <div>

                <div class="title">
                    Nội Bộ
                </div>

                <div class="version">
                    Version 5.0
                </div>

                <div
                    class="status"
                    id="groupTitle"
                >
                    ● Nội Bộ
                </div>

            </div>

        </div>

        <div class="right">

            <select
                id="groupSelect"
                class="group-select"
            >

                <option value="NoiBo">
                    Nội Bộ
                </option>

                <option value="KyThuat">
                    Kỹ Thuật
                </option>

                <option value="QuanLy">
                    Quản Lý
                </option>

                <option value="Cafe">
                    Cafe
                </option>

            </select>

            <div
                id="userBox"
                class="user"
            >
                Khách
            </div>

            <button
                id="logoutBtn"
                class="logout"
            >
                Thoát
            </button>

        </div>

    </div>



    <div
        id="messages"
        class="messages"
    ></div>



    <div class="bottom">

        <div class="sendbox">

            <label
                class="image-btn"
                for="imageInput"
            >
                📷
            </label>

            <input
                type="file"
                id="imageInput"
                accept="image/*"
                hidden
            >

            <input
                id="messageInput"
                class="send-input"
                placeholder="Nhập tin nhắn..."
            >

            <button
                id="sendBtn"
                class="send-btn"
            >
                ➤
            </button>

        </div>

    </div>

</div>



<!-- IMAGE VIEWER -->

<div
    id="imageViewer"
    class="image-viewer"
>

    <img
        id="viewerImage"
        class="viewer-image"
    >

</div>



<!-- FIREBASE -->

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script src="app.js"></script>

</body>
</html>
